<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LibraryMS{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin-right: 20px;
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background: #f2f2f2;
        }

        .available {
            color: green;
        }

        .unavailable {
            color: red;
        }
    </style>
</head>

<body>

<nav>
    <a href="{{ url_for('index') }}">Trang chủ</a>

    <a href="{{ url_for('books') }}">
        Danh sách sách
    </a>

    <a href="{{ url_for('api_books') }}">
        API
    </a>
</nav>

<hr>

{% block content %}
{% endblock %}

</body>
</html>
